# Окружение для локальной разработки: база и хранилище.
# API и веб запускаются через npm (см. README), чтобы работала горячая перезагрузка.
name: fakt

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fakt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fakt_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fakt}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище для фото и актов. SeaweedFS вместо MinIO:
  # MinIO с конца 2025 года не публикует образы бесплатной версии.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fakt_dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fakt_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-fakt}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
